# Ambiente local completo: `docker compose up --build`
#   painel  http://localhost:3000
#   API     http://localhost:8080/api/orders
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pedidocerto
      POSTGRES_USER: pedidocerto
      POSTGRES_PASSWORD: pedidocerto
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidocerto -d pedidocerto"]
      interval: 5s
      retries: 10

  api:
    build: ./api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/pedidocerto
      DATABASE_USER: pedidocerto
      DATABASE_PASSWORD: pedidocerto
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"

  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  web_node_modules:
